<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Suite</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <header>
      <h1>Password Suite</h1>
    </header>

    <div class="layout">
      <div>
        <section>
          <h2>Classifier</h2>
          <label for="passwordInput">Password</label>
          <input id="passwordInput" type="password" autocomplete="off" maxlength="256">
          <div class="field-error" id="passwordError" aria-live="polite"></div>
          <div class="actions">
            <button id="classifyBtn" type="button">Classify</button>
            <button id="togglePasswordBtn" class="secondary" type="button">Show</button>
          </div>
        </section>

        <section>
          <h2>Random Generator</h2>
          <label for="lengthInput">Length</label>
          <input id="lengthInput" type="number" min="4" max="128" value="16">
          <div class="checks">
            <label><input id="upperInput" type="checkbox" checked> Uppercase</label>
            <label><input id="lowerInput" type="checkbox" checked> Lowercase</label>
            <label><input id="digitsInput" type="checkbox" checked> Digits</label>
            <label><input id="symbolsInput" type="checkbox" checked> Symbols</label>
          </div>
          <div class="actions">
            <button id="generateBtn" type="button">Generate</button>
          </div>
          <div class="output-row">
            <div class="output" id="generatedOutput"></div>
            <button id="copyGeneratedBtn" class="secondary copy-btn" type="button" disabled>Copy</button>
          </div>
        </section>

        <section>
          <h2>Personalized Generator</h2>
          <div class="grid">
            <div>
              <label for="fruitInput">Fruit</label>
              <input id="fruitInput" type="text" autocomplete="off" pattern="[A-Za-z]+" inputmode="text" maxlength="40">
              <div class="field-error" id="fruitError" aria-live="polite"></div>
            </div>
            <div>
              <label for="streetInput">Street</label>
              <input id="streetInput" type="text" autocomplete="off" pattern="[A-Za-z ]+" inputmode="text" maxlength="40">
              <div class="field-error" id="streetError" aria-live="polite"></div>
            </div>
            <div>
              <label for="numberInput">Number</label>
              <input id="numberInput" type="text" autocomplete="off" pattern="[0-9]+" inputmode="numeric">
              <div class="field-error" id="numberError" aria-live="polite"></div>
            </div>
          </div>
          <div class="actions">
            <button id="personalizedBtn" type="button">Generate Personalized</button>
          </div>
          <div class="output-row">
            <div class="output" id="personalizedOutput"></div>
            <button id="copyPersonalizedBtn" class="secondary copy-btn" type="button" disabled>Copy</button>
          </div>
        </section>
      </div>

      <section class="result">
        <h2>Result</h2>
        <div class="score-row">
          <div class="badge" id="labelOutput">Waiting</div>
          <div class="meter"><span id="scoreMeter"></span></div>
        </div>
        <div class="meta">
          <div class="metric">
            <strong id="scoreOutput">0/100</strong>
            <span>Score</span>
          </div>
          <div class="metric">
            <strong id="entropyOutput">0</strong>
            <span>Entropy</span>
          </div>
          <div class="metric">
            <strong id="lengthOutput">0</strong>
            <span>Length</span>
          </div>
        </div>
        <div>
          <label>Reasons</label>
          <ul id="reasonsOutput"></ul>
        </div>
        <div>
          <label>Suggestions</label>
          <ul id="suggestionsOutput"></ul>
        </div>
      </section>
    </div>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
